<footer class="site-footer">

  <div class="container footer-body">

    {{/* ── Col 1: Brand ── */}}
    <div class="footer-col footer-col-brand">
      <a href="{{ "/" | relLangURL }}" class="footer-brand">{{ site.Title }}</a>
      <p class="footer-brand-desc">{{ site.Params.description }}</p>
      <div class="footer-badges">

        {{/* Row 1 */}}
        <a href="https://gohugo.io" class="footer-badge footer-badge-hugo" target="_blank" rel="noopener" aria-label="Hugo 驱动">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          Hugo 驱动
        </a>

        <a href="https://github.com/wangsirco/loveclaude" class="footer-badge footer-badge-lc" target="_blank" rel="noopener">主题 LoveClaude</a>

      </div>
    </div>


  </div>

  {{/* ── Bottom bar ── */}}
  <div class="footer-bottom">
    <div class="container footer-bottom-inner">
      <p class="footer-copyright">© {{ now.Format "2006" }} {{ site.Title }}</p>

    </div>
  </div>

</footer>
